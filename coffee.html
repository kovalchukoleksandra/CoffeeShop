<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="coffee.css">
</head>
<body>

<header class="header">
    <h1>Menu</h1>
    <div class="header-right">
    <input type="text" id="search" placeholder="Пошук...">
    <button id="auth-btn" onclick="openModal()">Увійти</button> 
    <button onclick="toggleCart()">Кошик</button>
</div>
</header>

<div class="filters">
    <select id="filter">
        <option value="all">Усі</option>
        <option value="coffee">Кава</option>
        <option value="tea">Чай</option>
    </select>

    <select id="sort">
        <option value="">Без сортування</option>
        <option value="name">За назвою</option>
        <option value="price">За ціною</option>
    </select>

    <input type="number" id="minPrice" placeholder="Від">
    <input type="number" id="maxPrice" placeholder="До">
    <button onclick="applyFilters()">Застосувати</button>
</div>
<div id="admin-panel" class="modal hidden" style="z-index: 9999;">
    <div class="modal-content" style="position: relative; max-width: 500px;">
        
        <span onclick="toggleAdminPanel()" style="cursor: pointer; position: absolute; top: 10px; right: 15px; font-weight: bold; font-size: 1.3em;">✖</span>
        
        <h2 id="admin-panel-title" style="color: #5d3a1a; margin-top: 0;">Новий товар</h2>
        
        <form id="add-product-form" style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
            <label>Назва товару: <input type="text" id="prod-name" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;"></label>
            <label>Тип товару:
                <select id="prod-type" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="coffee">Кава</option>
                    <option value="tea">Чай</option>
                </select>
            </label>
            <label>Ціна (грн): <input type="number" id="prod-price" min="1" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;"></label>
            <label>URL картинки: <input type="text" id="prod-img" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;"></label>
            <label>Опис: <textarea id="prod-desc" required style="width: 100%; padding: 8px; height: 70px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea></label>
            
            <button id="admin-submit-btn" type="button" onclick="handleAdminSubmit(event)" style="background: #28a745; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1em; margin-top: 5px;">Зберегти та додати</button>
        </form>
    </div>
</div>

<section>
    <div id="products" class="cards"></div>
</section>


<section class="news-section">
    <h2>Новини</h2>
    <div class="news-container">
        <aside class="news-sidebar" id="news-titles"></aside>
        
        <main class="news-content" id="active-news-body">
            <p>Оберіть новину для перегляду</p>
        </main>
    </div>
    <button id="load-more-news" class="more-btn" onclick="loadMoreNews()">Більше</button>
</section>

<section class="charts-section" style="padding: 20px;">
    <h2>Статистика пропозицій</h2>
    <select id="chart-type" onchange="drawCharts()" style="margin-bottom: 20px; padding: 10px; border-radius: 10px;">
        <option value="bar">Гістограма (Стовпчики)</option>
        <option value="pie">Кругова діаграма</option>
        <option value="line">Графік (Лінії)</option>
    </select>
    <div style="background: #fff; padding: 20px; border-radius: 15px; border: 1px solid #eee;">
        <canvas id="myCanvas" width="600" height="400" style="width: 100%; max-width: 600px; display: block; margin: 0 auto;"></canvas>
    </div>
</section>

<div id="cart" class="cart hidden">
    <h3>
        Кошик 
        <span onclick="toggleCart()" style="cursor:pointer;position:absolute; top:10px; right:15px;">✖</span>
    </h3>
    <ul id="cart-items"></ul>
    <p id="total">Разом: 0 грн</p>
    <button id="checkout-btn" class="checkout-btn" onclick="sendOrder()">Відправити замовлення</button>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-content">

        <span onclick="closeModal()" 
        style="cursor:pointer; position:absolute; top:10px; right:15px;">
        ✖
        </span>

        <div id="login-form">

            <h2>Авторизація</h2>

            <input type="text" id="login-name" placeholder="Логін">

            <input type="password" id="login-password" placeholder="Пароль">

            <p id="login-message"></p>

            <button onclick="login()">Увійти</button>

            <p>
                Немає акаунта?
                <span onclick="showRegister()" 
                style="color:blue; cursor:pointer;">
                    Реєстрація
                </span>
            </p>

        </div>

        <div id="register-form" class="hidden">

            <h2>Реєстрація</h2>

            <input type="text" id="reg-login" placeholder="Логін">

            <input type="email" id="reg-email" placeholder="Email">

            <input type="password" id="reg-password" placeholder="Пароль">

            <input type="password" id="reg-repeat" placeholder="Повторіть пароль">

            <p id="register-message"></p>

            <button onclick="register()">Зареєструватися</button>

            <p>
                Вже є акаунт?
                <span onclick="showLogin()" 
                style="color:blue; cursor:pointer;">
                    Увійти
                </span>
            </p>

        </div>

    </div>
</div>

<div id="order-modal" class="modal hidden">
    <div class="modal-content">
        <span onclick="closeOrderModal()" style="cursor:pointer; position:absolute; top:10px; right:15px;">✖</span>
        <h2>Замовлення прийнято!</h2>
        <div id="order-info"></div> <br>
        <button onclick="closeOrderModal()">Зрозуміло</button>
    </div>
</div>
<script src="coffee.js"></script>
</body>
</html>
