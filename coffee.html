<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="coffee.css">
</head>
<body>

<header class="header">
    <h1>Menu</h1>
    <div class="header-right">
    <input type="text" id="search" placeholder="Пошук...">
    <button onclick="openModal()">Увійти</button>
    <button onclick="toggleCart()">Кошик</button>
    </div>
</header>

<div class="filters">
    <select id="filter">
        <option value="all">Усі</option>
        <option value="coffee">Кава</option>
        <option value="tea">Чай</option>
    </select>

    <select id="sort">
        <option value="">Без сортування</option>
        <option value="name">За назвою</option>
        <option value="price">За ціною</option>
    </select>

    <input type="number" id="minPrice" placeholder="Від">
    <input type="number" id="maxPrice" placeholder="До">
    <button onclick="applyFilters()">Застосувати</button>
</div>

<section>
    <div id="products" class="cards"></div>
</section>

<section>
    <h2>Новини</h2>
    <div id="news"></div>
</section>


<div id="cart" class="cart hidden">
    <h3>
        Кошик 
        <span onclick="toggleCart()" style="cursor:pointer;position:absolute; top:10px; right:15px;">✖</span>
    </h3>
    <ul id="cart-items"></ul>
</div>


<div id="modal" class="modal hidden">
    <div class="modal-content">
<span onclick="closeModal()" style="cursor:pointer; position:absolute; top:10px; right:15px;">✖</span>
        <h2>Авторизація</h2>
        <input type="text" placeholder="Логін" autocomplete="off">
        <input type="password" placeholder="Пароль" autocomplete="new-password">
        <br>
        <button onclick="closeModal()">Відправити</button>
    </div>
</div>

<script src="coffee.js"></script>
</body>
</html>
